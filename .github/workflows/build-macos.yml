name: Build macOS app

on:
  workflow_dispatch:        # запуск вручну кнопкою на GitHub
  push:
    tags:
      - "v*"                # або автоматично при тегу, напр. v1.0

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-14         # віртуальний Мак на Apple Silicon (M1/M2…)
            arch: arm64
          - runner: macos-15-intel   # віртуальний Мак на Intel (x86_64)
            arch: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build .app
        run: |
          pyinstaller --windowed --noconfirm \
            --name Transcriber \
            --icon assets/icon.png \
            --add-data "assets:assets" \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            window.py

      - name: Pack .app into zip
        run: |
          cd dist
          ditto -c -k --keepParent Transcriber.app Transcriber-macos-${{ matrix.arch }}.zip

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: Transcriber-macos-${{ matrix.arch }}
          path: dist/Transcriber-macos-${{ matrix.arch }}.zip
